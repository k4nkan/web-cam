<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,0,0"
      rel="stylesheet"
    />
    <title>3D-cam</title>
  </head>
  <body>
    <main class="app state-loading">
      <section id="loadingScreen" class="loading-screen" aria-label="読み込み中" aria-live="polite">
        <div class="loading-ducks" aria-hidden="true">
          <img class="loading-duck" src="/images/tobisuke.webp" alt="" />
          <img class="loading-duck" src="/images/tobisuke.webp" alt="" />
          <img class="loading-duck" src="/images/tobisuke.webp" alt="" />
          <img class="loading-duck" src="/images/tobisuke.webp" alt="" />
        </div>
      </section>

      <section class="home-screen" aria-label="start camera">
        <div class="model-picker">
          <label for="modelSelect">貸し出し備品一覧</label>
          <select id="modelSelect" class="sr-only">
            <option value="" selected disabled>モデルを読み込み中...</option>
          </select>
          <div id="modelGallery" class="model-gallery" aria-label="モデル一覧"></div>
          <input id="modelImageInput" class="sr-only" type="file" accept="image/*" />
        </div>
        <div class="camera-start-panel">
          <button
            id="photoGalleryButton"
            class="photo-gallery-button"
            type="button"
            aria-label="みんなの写真を見る"
            aria-expanded="false"
          >
            <span class="material-symbols-rounded" aria-hidden="true">photo_library</span>
            <span>みんなの写真</span>
          </button>
          <button id="startButton" class="start-button" type="button" disabled>
            <span id="startButtonIcon" class="material-symbols-rounded" aria-hidden="true" hidden>photo_camera</span>
            <span id="startButtonLabel" aria-live="polite">モデル取得中...</span>
          </button>
        </div>
      </section>

      <section class="stage" aria-label="camera">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <div id="threeLayer" class="three-layer"></div>
        <button id="homeFromCameraButton" class="home-button" type="button" aria-label="トップへ戻る">
          <span class="material-symbols-rounded" aria-hidden="true">home</span>
        </button>
        <button id="switchCameraButton" class="camera-switch-button" type="button" aria-label="カメラ切替" disabled>
          <span class="material-symbols-rounded" aria-hidden="true">flip_camera_ios</span>
        </button>
        <button id="captureButton" class="capture-button" type="button" aria-label="撮影" disabled>
          <span class="material-symbols-rounded" aria-hidden="true">camera</span>
        </button>
        <div class="scale-control" aria-label="model size controls">
          <button
            class="scale-limit-button"
            type="button"
            data-scale-limit="max"
            aria-label="モデルを最大サイズにする"
          >
            <span class="material-symbols-rounded" aria-hidden="true">add</span>
          </button>
          <input
            id="modelScaleRange"
            class="model-scale-range"
            type="range"
            min="0.5"
            max="1.8"
            step="0.05"
            value="1"
            aria-label="モデルサイズ"
          />
          <button
            class="scale-limit-button"
            type="button"
            data-scale-limit="min"
            aria-label="モデルを最小サイズにする"
          >
            <span class="material-symbols-rounded" aria-hidden="true">remove</span>
          </button>
        </div>
        <div class="model-controls" aria-label="model controls">
          <div class="move-pad">
            <button type="button" data-move="up" aria-label="上へ移動">
              <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_up</span>
            </button>
            <button type="button" data-move="left" aria-label="左へ移動">
              <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_left</span>
            </button>
            <button type="button" data-move="right" aria-label="右へ移動">
              <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_right</span>
            </button>
            <button type="button" data-move="down" aria-label="下へ移動">
              <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_down</span>
            </button>
          </div>
        </div>
      </section>

      <section id="previewScreen" class="preview-screen" aria-label="preview">
        <img id="resultImage" alt="撮影した写真" />
        <button id="homeFromPreviewButton" class="home-button" type="button" aria-label="トップへ戻る">
          <span class="material-symbols-rounded" aria-hidden="true">home</span>
        </button>
        <div id="photoSharePrompt" class="photo-share-prompt" hidden>
          <p>この写真を「みんなの写真」に公開しますか？</p>
          <div class="photo-share-actions">
            <button id="declinePhotoShareButton" type="button">今回はしない</button>
            <button id="confirmPhotoShareButton" class="photo-share-confirm-button" type="button">
              公開する
            </button>
          </div>
        </div>
        <div class="preview-actions">
          <button id="retakeButton" class="secondary-button" type="button">再撮影</button>
          <a id="saveLink" class="save-link" download="duck-camera.jpg">保存</a>
        </div>
      </section>

      <section id="photoGalleryScreen" class="photo-gallery-screen" aria-label="みんなの写真" hidden>
        <header class="photo-gallery-header">
          <h1>みんなの写真</h1>
          <button id="closePhotoGalleryButton" type="button" aria-label="写真一覧を閉じる">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </header>
        <p id="photoGalleryStatus" class="photo-gallery-status" role="status"></p>
        <div id="photoGalleryGrid" class="photo-gallery-grid"></div>
      </section>

      <p id="statusText" class="status-text" role="status"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

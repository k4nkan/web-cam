<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Camera</title>
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="camera preview">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <div id="threeLayer" class="three-layer"></div>
        <div id="emptyState" class="empty-state">
          <h1>Duck Camera</h1>
          <p>カメラを起動すると、定位置の duck と一緒に撮影できます。</p>
        </div>
      </section>

      <section class="controls" aria-label="camera controls">
        <button id="startButton" type="button">カメラ起動</button>
        <button id="captureButton" type="button" disabled>撮影</button>
        <a id="saveLink" class="save-link is-hidden" download="duck-camera.jpg">保存</a>
      </section>

      <section id="resultPanel" class="result-panel is-hidden" aria-label="captured photo">
        <img id="resultImage" alt="撮影した写真" />
      </section>

      <p id="statusText" class="status-text" role="status"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

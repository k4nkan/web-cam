<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Camera</title>
  </head>
  <body>
    <main class="app state-home">
      <section class="home-screen" aria-label="start camera">
        <button id="startButton" class="start-button" type="button">カメラ起動</button>
      </section>

      <section class="stage" aria-label="camera">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <div id="threeLayer" class="three-layer"></div>
        <button id="captureButton" class="capture-button" type="button" aria-label="撮影" disabled></button>
      </section>

      <section id="previewScreen" class="preview-screen" aria-label="preview">
        <img id="resultImage" alt="撮影した写真" />
        <div class="preview-actions">
          <button id="retakeButton" class="secondary-button" type="button">再撮影</button>
          <a id="saveLink" class="save-link" download="duck-camera.jpg">保存</a>
        </div>
      </section>

      <p id="statusText" class="sr-only" role="status"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
